<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Snake Game - Created by Maha</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { box-sizing: border-box; }
        html, body { width: 100%; height: 100%; margin: 0; padding: 0; }
        body {
            font-family: 'Rajdhani', sans-serif;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            background-color: #08080a;
            color: #ffffff;
            width: 100%;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 12px;
        }
        .arcade-font { font-family: 'Press Start 2P', monospace; }

        body.theme-neon { background-color: #08080a; color: #ffffff; }
        body.theme-dark { background-color: #121212; color: #e0e0e0; }
        body.theme-light { background-color: #f0f4f8; color: #1e293b; }
        body.theme-retro { background-color: #1b263b; color: #e0e1dd; }

        #modeScreen, #homeScreen, #gameOverScreen, #pauseScreen {
            overflow-y: auto;
            scrollbar-width: none;
        }
        #modeScreen::-webkit-scrollbar, #homeScreen::-webkit-scrollbar, #gameOverScreen::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>
<body class="theme-neon">

    <!-- TOP STATS BAR -->
    <header id="topBar" class="w-full max-w-md flex justify-between items-center bg-zinc-900/90 backdrop-blur-md border border-zinc-800 px-4 py-2.5 rounded-2xl shadow-lg hidden">
        <div class="flex items-center gap-4">
            <div>
                <span class="text-[9px] text-cyan-400 tracking-widest font-bold uppercase block">Score</span>
                <span id="scoreVal" class="arcade-font text-xs">0</span>
            </div>
        </div>
        <div class="flex items-center gap-4">
            <div class="text-right">
                <span class="text-[9px] text-yellow-400 tracking-widest font-bold uppercase block">High</span>
                <span id="highScoreVal" class="arcade-font text-xs">0</span>
            </div>
            <button onclick="togglePause()" class="bg-zinc-800 hover:bg-zinc-700 px-3.5 py-1.5 rounded-xl arcade-font text-[10px] text-white border border-zinc-700">❚❚</button>
        </div>
    </header>

    <!-- MAIN GAME VIEWPORT -->
    <main id="gameTouchArea" class="relative flex justify-center items-center my-auto w-full flex-grow">
        <div id="gameBorderContainer" class="relative rounded-2xl overflow-hidden border-4 border-zinc-700 shadow-2xl bg-black/60 flex justify-center items-center transition-all duration-300">
            <canvas id="gameCanvas" width="520" height="520" class="block max-w-full max-h-[70vh] object-contain"></canvas>
            
            <!-- 1. HOME SCREEN -->
            <div id="homeScreen" class="absolute inset-0 bg-black/95 backdrop-blur-md flex flex-col justify-center items-center text-center p-6 z-20">
                <h1 class="arcade-font text-cyan-400 text-xl mb-2 drop-shadow-[0_0_15px_rgba(0,240,255,0.7)]">SNAKE GAME</h1>
                <p class="text-xs text-pink-400 font-bold mb-8 tracking-widest">"created by Maha"</p>
                <div class="w-56">
                    <button onclick="openPlayerSetup()" class="arcade-font w-full bg-cyan-500 hover:bg-cyan-400 text-black text-xs font-bold py-4 px-6 rounded-xl active:scale-95 transition-all shadow-lg">START</button>
                </div>
            </div>

            <!-- 2. PLAYER SETUP & SETTINGS SCREEN -->
            <div id="modeScreen" class="absolute inset-0 bg-black/95 backdrop-blur-md flex flex-col justify-center items-center text-center p-6 z-20 hidden">
                <h2 class="arcade-font text-cyan-400 text-xs mb-3">PLAYER SETUP</h2>
                <div class="w-full max-w-xs flex flex-col gap-2.5 text-left">
                    <div>
                        <label class="text-[10px] text-zinc-400 font-bold block mb-1">Enter Your Name:</label>
                        <input type="text" id="playerNameInput" value="" autocomplete="off" placeholder="Your Name" class="w-full bg-zinc-900 border border-zinc-700 text-white text-xs p-2 rounded-xl outline-none" />
                    </div>
                    <div>
                        <label class="text-[10px] text-zinc-400 font-bold block mb-1">Snake Style:</label>
                        <select id="snakeStyleSelect" class="w-full bg-zinc-900 border border-zinc-700 text-white text-xs p-2 rounded-xl outline-none">
                            <option value="classic">Classic Green</option>
                            <option value="colorful">Colorful Gradient</option>
                            <option value="eyes">Snake with Eyes</option>
                            <option value="neon">Neon Cyan/Pink</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-[10px] text-zinc-400 font-bold block mb-1">Sound FX:</label>
                        <select id="soundToggle" class="w-full bg-zinc-900 border border-zinc-700 text-white text-xs p-2 rounded-xl outline-none">
                            <option value="on">Sound ON</option>
                            <option value="off">Sound OFF</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-[10px] text-zinc-400 font-bold block mb-1">Theme:</label>
                        <select id="themeSelect" onchange="updateTheme(this.value)" class="w-full bg-zinc-900 border border-zinc-700 text-white text-xs p-2 rounded-xl outline-none">
                            <option value="theme-neon">Neon Arcade</option>
                            <option value="theme-dark">Dark Minimal</option>
                            <option value="theme-light">Light Clean</option>
                            <option value="theme-retro">Retro Blue</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-[10px] text-zinc-400 font-bold block mb-1">Background Music:</label>
                        <select id="musicSelect" class="w-full bg-zinc-900 border border-zinc-700 text-white text-xs p-2 rounded-xl outline-none">
                            <option value="suzume.mp3">Suzume</option>
                            <option value="alo alo.mp3">Alo Alo (Paro Song)</option>
                            <option value="off">Muted (Off)</option>
                        </select>
                    </div>
                </div>
                <div class="flex gap-3 mt-4">
                    <button onclick="switchScreen('homeScreen')" class="arcade-font bg-zinc-800 text-zinc-300 text-xs py-3 px-6 rounded-xl">BACK</button>
                    <button onclick="initGameAndStart()" class="arcade-font bg-cyan-500 text-black text-xs font-bold py-3 px-8 rounded-xl shadow-lg">START GAME</button>
                </div>
            </div>

            <!-- 3. GAME OVER SCREEN -->
            <div id="gameOverScreen" class="absolute inset-0 bg-black/95 backdrop-blur-md flex flex-col justify-center items-center text-center p-6 z-20 hidden">
                <div class="text-3xl mb-1">💀</div>
                <h2 class="arcade-font text-red-500 text-sm mb-2">GAME OVER</h2>
                <p id="playerResultText" class="text-cyan-400 text-xs font-bold mb-1">Player: Maha</p>
                <p id="finalScoreText" class="text-zinc-300 text-xs mb-1">Your Score: 0</p>
                <p id="finalHighScoreText" class="text-yellow-400 text-xs mb-3">High Score: 0</p>
                <div class="w-full max-w-xs bg-zinc-900 border border-zinc-800 rounded-xl p-3 mb-3 text-xs max-h-36 overflow-y-auto">
                    <div class="flex justify-between font-bold text-zinc-400 border-b border-zinc-800 pb-1 mb-1">
                        <span>TOP PLAYERS</span><span>SCORE</span>
                    </div>
                    <div id="leaderboardList" class="flex flex-col gap-1 text-xs"></div>
                </div>
                <div class="flex gap-3">
                    <button onclick="restartGame()" class="arcade-font bg-cyan-500 text-black text-xs font-bold py-3 px-6 rounded-xl shadow-lg">RESTART</button>
                    <button onclick="returnToHome()" class="arcade-font bg-zinc-800 text-zinc-300 text-xs py-3 px-6 rounded-xl">HOME</button>
                </div>
            </div>

            <!-- 4. PAUSE SCREEN -->
            <div id="pauseScreen" class="absolute inset-0 bg-black/90 backdrop-blur-md flex flex-col justify-center items-center text-center p-6 z-20 hidden">
                <h2 class="arcade-font text-yellow-400 text-sm mb-5">GAME PAUSED</h2>
                <div class="flex flex-col gap-3 w-48">
                    <button onclick="togglePause()" class="arcade-font bg-cyan-500 text-black text-xs font-bold py-3 px-4 rounded-xl">RESUME</button>
                    <button onclick="returnToHome()" class="arcade-font bg-zinc-800 text-zinc-300 text-xs py-3 px-4 rounded-xl">HOME</button>
                </div>
            </div>

        </div>
    </main>

    <!-- GAME ENGINE SCRIPT -->
    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        let snake = [];
        let food = { x: 5, y: 5, color: '#ff3333', points: 10 };
        let dx = 0;
        let dy = 0;
        let score = 0;
        let playerName = "Player";
        let highScores = JSON.parse(localStorage.getItem("snakeLeaderboard")) || [];
        let gameInterval = null;
        let gameActive = false;
        let isPaused = false;
        let speedDelay = 120;
        let snakeStyle = 'classic';
        let alertShown = false;

        let bgAudio = new Audio();
        bgAudio.loop = true;

        function playSound(type) {
            if (document.getElementById('soundToggle').value === 'off') return;
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                let now = audioCtx.currentTime;
                if (type === 'pop') {
                    osc.frequency.setValueAtTime(400, now);
                    osc.frequency.exponentialRampToValueAtTime(800, now + 0.08);
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
                } else if (type === 'boom') {
                    osc.frequency.setValueAtTime(150, now);
                    osc.frequency.linearRampToValueAtTime(30, now + 0.25);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
                }
                osc.start(now);
                osc.stop(now + 0.25);
            } catch (e) {}
        }

        function startMusic() {
            stopMusic();
            const selectedSong = document.getElementById('musicSelect').value;
            if (selectedSong === 'off') return;

            bgAudio.src = selectedSong;
            bgAudio.currentTime = 0;
            bgAudio.play().catch(err => {
                console.log("Audio play error:", err);
            });
        }

        function stopMusic() {
            bgAudio.pause();
            bgAudio.currentTime = 0;
        }

        function switchScreen(screenId) {
            ['homeScreen', 'modeScreen', 'gameOverScreen', 'pauseScreen'].forEach(id => {
                document.getElementById(id).classList.add('hidden');
            });
            if (screenId) {
                document.getElementById(screenId).classList.remove('hidden');
            }
        }

        function openPlayerSetup() {
            const inputField = document.getElementById('playerNameInput');
            inputField.value = "";
            switchScreen('modeScreen');
            setTimeout(() => inputField.focus(), 50);
        }

        function renderLeaderboard() {
            const list = document.getElementById('leaderboardList');
            if (highScores.length === 0) {
                list.innerHTML = `<div class="text-center text-zinc-500 py-1">No scores recorded yet!</div>`;
                return;
            }
            list.innerHTML = highScores.map((item, index) => `
                <div class="flex justify-between items-center text-zinc-300 border-b border-zinc-800/50 pb-0.5">
                    <span class="font-bold text-cyan-400">${index + 1}. ${item.name}</span>
                    <span class="arcade-font text-xs">${item.score}</span>
                </div>
            `).join('');
        }

        function updateTheme(themeClass) {
            document.body.className = `${themeClass}`;
        }

        function initGameAndStart() {
            const inputName = document.getElementById('playerNameInput').value.trim();
            if (inputName === "") {
                alert("Please enter your name!");
                return;
            }
            playerName = inputName;
            snakeStyle = document.getElementById('snakeStyleSelect').value;
            
            startMusic();

            switchScreen('');
            document.getElementById('topBar').classList.remove('hidden');
            
            startGame();
        }

        function startGame() {
            if (gameInterval) clearInterval(gameInterval);
            let mid = Math.floor(tileCount / 2);
            snake = [
                { x: mid, y: mid },
                { x: mid - 1, y: mid },
                { x: mid - 2, y: mid }
            ];
            dx = 0;
            dy = 0;
            score = 0;
            isPaused = false;
            gameActive = true;
            alertShown = false;

            const container = document.getElementById('gameBorderContainer');
            container.className = "relative rounded-2xl overflow-hidden border-4 border-zinc-700 shadow-2xl bg-black/60 flex justify-center items-center transition-all duration-300";
            
            document.getElementById('scoreVal').innerText = score;
            
            let playerBest = highScores.find(p => p.name.toLowerCase() === playerName.toLowerCase());
            document.getElementById('highScoreVal').innerText = playerBest ? playerBest.score : 0;
            
            spawnFood();
            renderGame();
            
            gameInterval = setInterval(mainLoop, speedDelay);
        }

        function mainLoop() {
            if (!gameActive || isPaused) return;
            if (dx === 0 && dy === 0) {
                renderGame();
                return;
            }
            
            let head = { x: snake[0].x + dx, y: snake[0].y + dy };

            // Wall Collision & Danger Threshold (Score 50)
            if (score >= 50) {
                if (!alertShown) {
                    alertShown = true;
                    alert("⚠ WARNING: Score reached 50! Walls are now DANGEROUS! Hitting the wall will end the game!");
                    const container = document.getElementById('gameBorderContainer');
                    container.className = "relative rounded-2xl overflow-hidden border-4 border-red-600 shadow-[0_0_25px_rgba(239,68,68,0.8)] bg-black/70 flex justify-center items-center transition-all duration-300";
                }
                if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                    triggerGameOver();
                    return;
                }
            } else {
                if (head.x < 0) head.x = tileCount - 1;
                if (head.x >= tileCount) head.x = 0;
                if (head.y < 0) head.y = tileCount - 1;
                if (head.y >= tileCount) head.y = 0;
            }

            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                playSound('pop');
                score += food.points;
                document.getElementById('scoreVal').innerText = score;
                
                let playerBest = highScores.find(p => p.name.toLowerCase() === playerName.toLowerCase());
                let currentBest = playerBest ? playerBest.score : 0;
                if (score > currentBest) {
                    document.getElementById('highScoreVal').innerText = score;
                }

                spawnFood();
            } else {
                snake.pop();
            }

            for (let i = 1; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    triggerGameOver();
                    return;
                }
            }
            renderGame();
        }

        function renderGame() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = food.color;
            ctx.shadowColor = food.color;
            ctx.shadowBlur = 8;
            ctx.beginPath();
            ctx.arc((food.x * gridSize) + gridSize / 2, (food.y * gridSize) + gridSize / 2, gridSize / 2 - 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            snake.forEach((part, index) => {
                if (snakeStyle === 'classic') {
                    ctx.fillStyle = index === 0 ? '#10b981' : '#059669';
                } else if (snakeStyle === 'colorful') {
                    const colors = ['#f43f5e', '#fb923c', '#facc15', '#4ade80', '#38bdf8', '#c084fc'];
                    ctx.fillStyle = colors[index % colors.length];
                } else if (snakeStyle === 'neon') {
                    ctx.fillStyle = index === 0 ? '#00f0ff' : '#ff007f';
                    ctx.shadowColor = ctx.fillStyle;
                    ctx.shadowBlur = 6;
                } else if (snakeStyle === 'eyes') {
                    ctx.fillStyle = index === 0 ? '#22c55e' : '#15803d';
                }
                ctx.fillRect(part.x * gridSize, part.y * gridSize, gridSize - 2, gridSize - 2);
            });
        }

        function spawnFood() {
            food.color = '#ff3333';
            food.points = 10;
            food.x = Math.floor(Math.random() * tileCount);
            food.y = Math.floor(Math.random() * tileCount);

            if (snake.some(p => p.x === food.x && p.y === food.y)) spawnFood();
        }

        function saveScoreAndLeaderboard() {
            let existingIndex = highScores.findIndex(p => p.name.toLowerCase() === playerName.toLowerCase());
            if (existingIndex !== -1) {
                if (score > highScores[existingIndex].score) {
                    highScores[existingIndex].score = score;
                }
            } else {
                highScores.push({ name: playerName, score: score });
            }
            highScores.sort((a, b) => b.score - a.score);
            highScores = highScores.slice(0, 10);
            localStorage.setItem("snakeLeaderboard", JSON.stringify(highScores));
        }

        function triggerGameOver() {
            playSound('boom');
            stopMusic();
            gameActive = false;
            if (gameInterval) clearInterval(gameInterval);

            saveScoreAndLeaderboard();
            let playerBest = highScores.find(p => p.name.toLowerCase() === playerName.toLowerCase());
            
            document.getElementById('playerResultText').innerText = `Player: ${playerName}`;
            document.getElementById('finalScoreText').innerText = `Your Score: ${score}`;
            document.getElementById('finalHighScoreText').innerText = `High Score: ${playerBest ? playerBest.score : score}`;
            
            renderLeaderboard();
            switchScreen('gameOverScreen');
            document.getElementById('topBar').classList.add('hidden');
        }

        function restartGame() {
            document.getElementById('topBar').classList.remove('hidden');
            switchScreen(''); 
            startGame();
            startMusic();
        }

        function returnToHome() {
            gameActive = false;
            stopMusic();
            if (gameInterval) clearInterval(gameInterval);
            document.getElementById('topBar').classList.add('hidden');
            switchScreen('homeScreen');
        }

        function togglePause() {
            if (!gameActive) return;
            isPaused = !isPaused;
            if (isPaused) {
                bgAudio.pause();
                switchScreen('pauseScreen');
                document.getElementById('topBar').classList.remove('hidden');
            } else {
                bgAudio.play();
                switchScreen('');
                document.getElementById('topBar').classList.remove('hidden');
            }
        }

        function setDir(direction) {
            if (!gameActive || isPaused) return;
            if (direction === 'UP' && dy === 0) { dx = 0; dy = -1; }
            if (direction === 'DOWN' && dy === 0) { dx = 0; dy = 1; }
            if (direction === 'LEFT' && dx === 0) { dx = -1; dy = 0; }
            if (direction === 'RIGHT' && dx === 0) { dx = 1; dy = 0; }
        }

        /* TOUCH SWIPE GESTURES */
        let touchStartX = 0;
        let touchStartY = 0;
        const touchArea = document.getElementById('gameTouchArea');

        touchArea.addEventListener('touchstart', e => {
            if (!gameActive || isPaused) return;
            const touch = e.touches[0];
            touchStartX = touch.clientX;
            touchStartY = touch.clientY;
        }, { passive: true });

        touchArea.addEventListener('touchmove', e => {
            if (!gameActive || isPaused) return;
            e.preventDefault();
        }, { passive: false });

        touchArea.addEventListener('touchend', e => {
            if (!gameActive || isPaused) return;
            if (!touchStartX || !touchStartY) return;

            let touchEndX = e.changedTouches[0].clientX;
            let touchEndY = e.changedTouches[0].clientY;

            let xDiff = touchEndX - touchStartX;
            let yDiff = touchEndY - touchStartY;

            if (Math.abs(xDiff) < 20 && Math.abs(yDiff) < 20) return;

            if (Math.abs(xDiff) > Math.abs(yDiff)) {
                if (xDiff > 0) { setDir('RIGHT'); } else { setDir('LEFT'); }
            } else {
                if (yDiff > 0) { setDir('DOWN'); } else { setDir('UP'); }
            }

            touchStartX = 0;
            touchStartY = 0;
        }, { passive: true });

        /* LAPTOP KEYBOARD ARROWS */
        window.addEventListener("keydown", e => {
            switch (e.key) {
                case "ArrowUp": setDir('UP'); e.preventDefault(); break;
                case "ArrowDown": setDir('DOWN'); e.preventDefault(); break;
                case "ArrowLeft": setDir('LEFT'); e.preventDefault(); break;
                case "ArrowRight": setDir('RIGHT'); e.preventDefault(); break;
                case "r":
                case "R":
                    if (!gameActive && !document.getElementById('gameOverScreen').classList.contains('hidden')) {
                        restartGame();
                    }
                    break;
            }
        });
    </script>
</body>
</html>
