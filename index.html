<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Snake Game - Created by Maha</title>

    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rajdhani:wght@600;700&display=swap"
          rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            height: 100dvh;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Rajdhani', sans-serif;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
            background-color: #08080a;
            color: #ffffff;

            /* IMPORTANT FIX */
            overflow: hidden;
        }

        input,
        select,
        button {
            font-family: 'Rajdhani', sans-serif;
        }

        .arcade-font {
            font-family: 'Press Start 2P', monospace;
        }

        /* =========================
           THEMES
        ========================= */

        body.theme-neon {
            background-color: #08080a;
            color: #ffffff;
        }

        body.theme-dark {
            background-color: #121212;
            color: #e0e0e0;
        }

        body.theme-light {
            background-color: #f0f4f8;
            color: #1e293b;
        }

        body.theme-retro {
            background-color: #1b263b;
            color: #e0e1dd;
        }

        /* =========================
           MAIN APP LAYOUT
        ========================= */

        #app {
            width: 100%;
            height: 100%;
            height: 100dvh;

            display: flex;
            flex-direction: column;

            padding: 10px 12px;

            overflow: hidden;
        }

        /* =========================
           TOP BAR
        ========================= */

        #topBar {
            width: 100%;
            max-width: 645px;

            margin: 0 auto;

            flex-shrink: 0;
        }

        /* =========================
           MAIN GAME AREA
        ========================= */

        #gameArea {
            width: 100%;
            flex: 1 1 auto;

            min-height: 0;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 8px 0;
        }

        #gameWrapper {
            position: relative;

            width: min(92vw, 520px);
            height: min(92vw, 520px);

            max-width: 520px;
            max-height: 100%;

            border-radius: 30px;
            overflow: hidden;

            border: 2px solid #27272a;
            background: rgba(0, 0, 0, 0.4);

            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);

            display: flex;
            justify-content: center;
            align-items: center;

            flex-shrink: 1;
        }

        #gameCanvas {
            display: block;

            width: 100%;
            height: 100%;

            max-width: 100%;
            max-height: 100%;

            object-fit: contain;
        }

        /* =========================
           OVERLAYS
        ========================= */

        .game-overlay {
            position: absolute;
            inset: 0;

            background: rgba(0, 0, 0, 0.95);

            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);

            display: flex;
            flex-direction: column;

            justify-content: center;
            align-items: center;

            text-align: center;

            padding: 20px;

            z-index: 20;

            overflow-y: auto;
        }

        /* Player setup specifically made scroll-safe */
        #modeScreen {
            justify-content: center;
        }

        /* =========================
           BOTTOM CONTROL DECK
        ========================= */

        #controlDeck {
            width: 100%;
            max-width: 420px;

            flex-shrink: 0;

            display: flex;
            justify-content: center;
            align-items: center;

            padding-top: 4px;

            /* Enough room for Android navigation area */
            padding-bottom: max(8px, env(safe-area-inset-bottom));

            min-height: 148px;
        }

        #dpad {
            width: 180px;
            height: 132px;

            display: grid;

            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(2, 1fr);

            gap: 8px;
        }

        .dpad-button {
            width: 100%;
            height: 100%;

            background: #27272a;

            border: 1px solid #3f3f46;

            color: #22d3ee;

            border-radius: 16px;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 20px;

            box-shadow:
                0 4px 10px rgba(0, 0, 0, 0.35);

            transition:
                transform 0.08s ease,
                background 0.08s ease;
        }

        .dpad-button:active {
            background: #06b6d4;
            color: #000;

            transform: scale(0.94);
        }

        #upButton {
            grid-column: 2;
            grid-row: 1;
        }

        #leftButton {
            grid-column: 1;
            grid-row: 2;
        }

        #downButton {
            grid-column: 2;
            grid-row: 2;
        }

        #rightButton {
            grid-column: 3;
            grid-row: 2;
        }

        /* =========================
           SMALL PHONE FIX
        ========================= */

        @media (max-height: 720px) {

            #app {
                padding-top: 6px;
                padding-bottom: 4px;
            }

            #topBar {
                padding-top: 9px;
                padding-bottom: 9px;
            }

            #gameArea {
                padding: 4px 0;
            }

            #controlDeck {
                min-height: 122px;
                padding-bottom: 4px;
            }

            #dpad {
                width: 150px;
                height: 108px;
                gap: 6px;
            }

            .dpad-button {
                border-radius: 14px;
                font-size: 18px;
            }
        }

        /* =========================
           VERY SMALL HEIGHT
        ========================= */

        @media (max-height: 620px) {

            #controlDeck {
                min-height: 105px;
            }

            #dpad {
                width: 135px;
                height: 94px;
            }

            .dpad-button {
                font-size: 16px;
            }

            #gameArea {
                padding: 2px 0;
            }
        }

        /* =========================
           SMALL WIDTH
        ========================= */

        @media (max-width: 380px) {

            #app {
                padding-left: 8px;
                padding-right: 8px;
            }

            #dpad {
                width: 150px;
            }

            .game-overlay {
                padding: 14px;
            }
        }

    </style>
</head>

<body class="theme-neon">

<div id="app">

    <!-- =========================
         TOP STATS BAR
    ========================= -->

    <header id="topBar"
            class="flex justify-between items-center bg-zinc-900/90 backdrop-blur-md border border-zinc-800 px-5 py-3 rounded-2xl shadow-lg hidden">

        <div class="flex items-center gap-5">

            <div>
                <span class="text-[10px] text-cyan-400 tracking-widest font-bold uppercase block">
                    Score
                </span>

                <span id="scoreVal"
                      class="arcade-font text-sm">
                    0
                </span>
            </div>

            <div>
                <span class="text-[10px] text-pink-500 tracking-widest font-bold uppercase block">
                    Level
                </span>

                <span id="levelVal"
                      class="arcade-font text-sm">
                    1
                </span>
            </div>

        </div>

        <div class="flex items-center gap-5">

            <div class="text-right">
                <span class="text-[10px] text-yellow-400 tracking-widest font-bold uppercase block">
                    High
                </span>

                <span id="highScoreVal"
                      class="arcade-font text-sm">
                    0
                </span>
            </div>

            <button
                onclick="togglePause()"
                class="bg-zinc-800 hover:bg-zinc-700 px-4 py-2 rounded-xl arcade-font text-xs text-white border border-zinc-700">
                ❚❚
            </button>

        </div>

    </header>


    <!-- =========================
         GAME AREA
    ========================= -->

    <main id="gameArea">

        <div id="gameWrapper">

            <canvas
                id="gameCanvas"
                width="520"
                height="520">
            </canvas>


            <!-- =========================
                 HOME SCREEN
            ========================= -->

            <div id="homeScreen"
                 class="game-overlay">

                <h1
                    class="arcade-font text-cyan-400 text-2xl mb-2 drop-shadow-[0_0_15px_rgba(0,240,255,0.7)]">
                    SNAKE GAME
                </h1>

                <p class="text-xs text-pink-400 font-bold mb-8 tracking-widest">
                    "created by Maha"
                </p>

                <div class="flex flex-col gap-3.5 w-56">

                    <button
                        onclick="openPlayerSetup()"
                        class="arcade-font bg-cyan-500 hover:bg-cyan-400 text-black text-xs font-bold py-3.5 px-6 rounded-xl active:scale-95 transition-all shadow-lg">
                        START GAME
                    </button>

                    <button
                        onclick="switchScreen('highScoreScreen')"
                        class="arcade-font bg-zinc-800 hover:bg-zinc-700 text-cyan-400 text-xs font-bold py-3.5 px-6 rounded-xl active:scale-95 transition-all border border-zinc-700">
                        HIGH SCORE
                    </button>

                    <button
                        onclick="switchScreen('howToScreen')"
                        class="arcade-font bg-zinc-800 hover:bg-zinc-700 text-cyan-400 text-xs font-bold py-3.5 px-6 rounded-xl active:scale-95 transition-all border border-zinc-700">
                        HOW TO PLAY
                    </button>

                    <button
                        onclick="switchScreen('settingsScreen')"
                        class="arcade-font bg-zinc-800 hover:bg-zinc-700 text-cyan-400 text-xs font-bold py-3.5 px-6 rounded-xl active:scale-95 transition-all border border-zinc-700">
                        SETTINGS
                    </button>

                </div>

            </div>


            <!-- =========================
                 PLAYER SETUP
            ========================= -->

            <div id="modeScreen"
                 class="game-overlay hidden">

                <h2 class="arcade-font text-cyan-400 text-sm mb-4">
                    PLAYER SETUP
                </h2>

                <div class="w-full max-w-sm flex flex-col gap-4 text-left">

                    <div>

                        <label class="text-xs text-zinc-400 font-bold block mb-1.5">
                            Your Name:
                        </label>

                        <input
                            type="text"
                            id="playerNameInput"
                            value=""
                            autocomplete="off"
                            placeholder="Enter your name"
                            class="w-full bg-zinc-900 border border-zinc-700 text-white text-sm p-3 rounded-xl outline-none">

                    </div>


                    <div>

                        <label class="text-xs text-zinc-400 font-bold block mb-1.5">
                            Snake Style:
                        </label>

                        <select
                            id="snakeStyleSelect"
                            class="w-full bg-zinc-900 border border-zinc-700 text-white text-sm p-3 rounded-xl outline-none">

                            <option value="classic">
                                Classic Green
                            </option>

                            <option value="colorful">
                                Colorful Gradient
                            </option>

                            <option value="eyes">
                                Snake with Eyes
                            </option>

                            <option value="neon">
                                Neon Cyan/Pink
                            </option>

                        </select>

                    </div>


                    <div>

                        <label class="text-xs text-zinc-400 font-bold block mb-1.5">
                            Starting Level (1-5):
                        </label>

                        <select
                            id="startLevelSelect"
                            class="w-full bg-zinc-900 border border-zinc-700 text-white text-sm p-3 rounded-xl outline-none">

                            <option value="1">
                                Level 1 - Slow
                            </option>

                            <option value="2">
                                Level 2 - Normal
                            </option>

                            <option value="3">
                                Level 3 - Fast
                            </option>

                            <option value="4">
                                Level 4 - Very Fast
                            </option>

                            <option value="5">
                                Level 5 - Insane
                            </option>

                        </select>

                    </div>

                </div>


                <div class="flex gap-3 mt-5">

                    <button
                        onclick="switchScreen('homeScreen')"
                        class="arcade-font bg-zinc-800 text-zinc-300 text-xs py-3.5 px-6 rounded-xl">
                        BACK
                    </button>

                    <button
                        onclick="initGameAndStart()"
                        class="arcade-font bg-cyan-500 text-black text-xs font-bold py-3.5 px-8 rounded-xl shadow-lg">
                        PLAY NOW
                    </button>

                </div>

            </div>


            <!-- =========================
                 GAME OVER
            ========================= -->

            <div id="gameOverScreen"
                 class="game-overlay hidden">

                <div class="text-4xl mb-2">
                    💀
                </div>

                <h2 class="arcade-font text-red-500 text-base mb-3">
                    GAME OVER
                </h2>

                <p
                    id="playerResultText"
                    class="text-cyan-400 text-sm font-bold mb-1.5">
                    Player: Maha
                </p>

                <p
                    id="finalScoreText"
                    class="text-zinc-300 text-sm mb-1.5">
                    Your Score: 0
                </p>

                <p
                    id="finalHighScoreText"
                    class="text-yellow-400 text-sm mb-6">
                    Best Score: 0
                </p>

                <div class="flex gap-3">

                    <button
                        onclick="restartGame()"
                        class="arcade-font bg-cyan-500 text-black text-xs font-bold py-3.5 px-6 rounded-xl shadow-lg">
                        RESTART
                    </button>

                    <button
                        onclick="returnToHome()"
                        class="arcade-font bg-zinc-800 text-zinc-300 text-xs py-3.5 px-6 rounded-xl">
                        HOME
                    </button>

                </div>

            </div>


            <!-- =========================
                 PAUSE
            ========================= -->

            <div id="pauseScreen"
                 class="game-overlay hidden">

                <h2 class="arcade-font text-yellow-400 text-base mb-6">
                    GAME PAUSED
                </h2>

                <div class="flex flex-col gap-3.5 w-48">

                    <button
                        onclick="togglePause()"
                        class="arcade-font bg-cyan-500 text-black text-xs font-bold py-3.5 px-4 rounded-xl">
                        RESUME
                    </button>

                    <button
                        onclick="returnToHome()"
                        class="arcade-font bg-zinc-800 text-zinc-300 text-xs py-3.5 px-4 rounded-xl">
                        HOME
                    </button>

                </div>

            </div>


            <!-- =========================
                 HIGH SCORE
            ========================= -->

            <div id="highScoreScreen"
                 class="game-overlay hidden">

                <h2 class="arcade-font text-yellow-400 text-sm mb-4">
                    LEADERBOARD
                </h2>

                <div
                    class="w-full
